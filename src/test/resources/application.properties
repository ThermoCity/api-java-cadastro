spring.application.name=ThermoCity

spring.datasource.url=jdbc:h2:mem:thermocity;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Par de chaves exclusivo dos testes (nao e usado em nenhum ambiente real)
api.security.token.private-key=classpath:keys-test/private_key.pem
api.security.token.public-key=classpath:keys-test/public_key.pem
api.security.token.issuer=thermocity
api.security.token.expiration-hours=2

cors.allowed-origins=*

geocoding.awesomeapi.url=http://localhost:0/{cep}
geocoding.brasilapi.url=http://localhost:0/{cep}
geocoding.timeout-seconds=1

# Documentacao OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
