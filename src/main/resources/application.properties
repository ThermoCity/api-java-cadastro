spring.application.name=ThermoCity

# Banco de dados (credenciais)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT RS256: a API Java assina com a chave privada; a API .NET valida so com a chave publica.
api.security.token.private-key=${JWT_PRIVATE_KEY:classpath:keys/private_key.pem}
api.security.token.public-key=${JWT_PUBLIC_KEY:classpath:keys/public_key.pem}
api.security.token.issuer=${JWT_ISSUER:thermocity}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Geocodificacao do CEP (servicos gratuitos)
geocoding.awesomeapi.url=https://cep.awesomeapi.com.br/json/{cep}
geocoding.brasilapi.url=https://brasilapi.com.br/api/cep/v2/{cep}
geocoding.timeout-seconds=5

# Documentacao OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
