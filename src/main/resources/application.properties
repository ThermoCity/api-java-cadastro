spring.application.name=ThermoCity

# ---------- Banco de dados (Oracle) ----------
# Valores vem das variaveis de ambiente (no Azure: Key Vault kv-thermocity-java). Nunca coloque senha no codigo.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
