spring.application.name=ThermoCity
# ---------- Banco de dados (PostgreSQL) ----------
# Valores vem das variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD (no Azure: App Settings). Nunca coloque senha no codigo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false

# JWT RS256: a API Java assina com a chave privada; a API .NET valida so com a chave publica.
api.security.token.private-key=${JWT_PRIVATE_KEY:classpath:keys/private_key.pem}
api.security.token.public-key=${JWT_PUBLIC_KEY:classpath:keys/public_key.pem}
api.security.token.issuer=${JWT_ISSUER:thermocity}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://thermocity-gemeo-front.vercel.app}

# Geocodificacao do CEP (servicos gratuitos)
geocoding.awesomeapi.url=https://cep.awesomeapi.com.br/json/{cep}
geocoding.brasilapi.url=https://brasilapi.com.br/api/cep/v2/{cep}
geocoding.timeout-seconds=5

# Documentacao OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# ---------- Regras do ThermoCity ----------
# Unidades cadastradas como UBS que nao atendem a populacao (penitenciaria, ressocializacao, triagem COVID)
thermocity.ubs.excluidas=CNES-8016305,CNES-8016291,CNES-118796
# Refugios usados na regra dos 800 m (coluna revisao de tmc_servico)
thermocity.refugios.revisoes=manter,potencial

# ---------- Lista priorizada de busca ativa (regra v1) ----------
# Onde a priorizacao roda: banco (procedure tmc_prc_gerar_lista_busca_ativa, scripts/script-priorizacao.sql) ou java
thermocity.busca.priorizacao=${PRIORIZACAO:banco}

# ---------- RabbitMQ (evento de nivel de calor publicado pela API .NET) ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
thermocity.rabbitmq.consumidor-ativo=${RABBITMQ_CONSUMIDOR_ATIVO:true}
# Erro na mensagem: ate 3 tentativas e depois a fila de erro (DLQ), sem reenfileirar para sempre
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
thermocity.rabbitmq.exchange=thermocity.clima
thermocity.rabbitmq.routing-key=nivel-calor.alterado
thermocity.rabbitmq.fila=thermocity.cadastro.nivel-calor
thermocity.rabbitmq.exchange-erro=thermocity.clima.dlx
thermocity.rabbitmq.fila-erro=thermocity.cadastro.nivel-calor.dlq

